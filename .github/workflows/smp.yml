name: KPX SMP 수집

# 실행 시점
on:
  schedule:
    # UTC 기준입니다. 한국시간(KST) = UTC + 9시간.
    # SMP 는 보통 KST 16~19시에 갱신되므로, 그 구간만 10분 간격으로 확인.
    # KST 16:00~19:50  =  UTC 07:00~10:50
    # 참고: GitHub Actions schedule 은 서버 상황에 따라 수 분~십수 분
    #       지연될 수 있어 실제 간격이 더 벌어질 수 있습니다(정상).
    - cron: "*/10 7-10 * * *"
  workflow_dispatch:   # 저장소 Actions 탭에서 수동 실행 버튼

# 저장소에 커밋(파일 저장)하려면 쓰기 권한 필요
permissions:
  contents: write

jobs:
  fetch-smp:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests openpyxl

      - name: SMP 수집 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python smp_fetch.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "SMP 데이터 업데이트: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
